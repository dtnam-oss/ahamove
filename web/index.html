<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Chia chọn đơn</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
  <!-- Start gate: one tap unlocks speech on iOS/Safari and loads data. -->
  <div id="start-gate" class="gate">
    <div class="gate-card">
      <h1>Chia chọn đơn</h1>
      <p>Quét mã vận đơn bằng súng barcode hoặc camera điện thoại. Kết quả được đọc bằng giọng nói.</p>
      <button id="start-btn" class="btn btn-primary btn-lg" type="button">Bắt đầu ca</button>
    </div>
  </div>

  <main class="app">
    <header class="topbar">
      <div>
        <strong>Chia chọn đơn</strong>
        <div id="data-status" class="muted">Chưa tải dữ liệu</div>
      </div>
      <button id="reload-btn" class="btn" type="button">Tải lại</button>
    </header>

    <div id="voice-warning" class="banner" hidden>
      Thiết bị chưa có giọng đọc tiếng Việt. Kết quả vẫn hiển thị trên màn hình.
    </div>

    <div class="mode-bar" role="group" aria-label="Chế độ">
      <button type="button" class="btn mode-btn" data-mode="sort" aria-pressed="true">Chia chọn</button>
      <button type="button" class="btn mode-btn" data-mode="routesort" aria-pressed="false">Chia tuyến</button>
      <button type="button" class="btn mode-btn" data-mode="trip" aria-pressed="false">Chuyến đi</button>
      <button type="button" class="btn mode-btn" data-mode="backlog" aria-pressed="false">Backlog</button>
      <button type="button" class="btn mode-btn" data-mode="route" aria-pressed="false">Tuyến</button>
    </div>

    <!-- Chuyến đi mode, home: create a trip (plate first) and the trips of a day from every device (sheet chuyen_di). -->
    <section id="trip-home" class="trip-home" hidden>
      <button id="trip-new" class="btn btn-primary btn-lg" type="button">+ Tạo chuyến đi</button>
      <form id="trip-plate-form" class="trip-plate-form" autocomplete="off" hidden>
        <label for="trip-plate">Biển kiểm soát (BKS)</label>
        <input id="trip-plate" class="plate-input" type="text" placeholder="29C-123.45" maxlength="15"
               autocapitalize="characters" spellcheck="false" enterkeyhint="go" />
        <div id="trip-plate-hint" class="muted" aria-live="polite"></div>
        <div class="trip-plate-actions">
          <button class="btn btn-primary" type="submit">Bắt đầu quét</button>
          <button id="trip-plate-cancel" class="btn" type="button">Huỷ</button>
        </div>
      </form>
      <div class="trip-list-bar">
        <b>Danh sách chuyến</b>
        <label for="trip-day" class="sr-only">Ngày</label>
        <input id="trip-day" class="day-input" type="date" />
      </div>
      <div id="trip-note" class="muted" aria-live="polite"></div>
      <div id="trip-list" class="trip-list"></div>
    </section>

    <!-- Chuyến đi mode, scanning: the trip being loaded (kept on this device until it is finished). -->
    <div id="trip-progress" class="route-progress" hidden>
      <div class="route-progress-info">
        <div id="trip-plate-label" class="muted"></div>
        <div id="trip-count" class="route-count">0 đơn</div>
      </div>
      <div class="route-actions">
        <button id="trip-finish" class="btn btn-primary" type="button" disabled>Kết thúc chuyến</button>
        <button id="trip-cancel" class="btn" type="button">Huỷ chuyến</button>
      </div>
    </div>

    <!-- Tuyến mode, step 1: pick the routes to load (districts expand to their wards). -->
    <section id="route-picker" class="route-picker" hidden>
      <div class="route-picker-head">Chọn tuyến xuất hàng</div>
      <div id="route-list" class="route-list"></div>
      <button id="route-start" class="btn btn-primary btn-lg" type="button" disabled>Chọn tuyến để bắt đầu</button>
    </section>

    <!-- Tuyến mode, step 2: loading progress of the selected routes (kept on this device). -->
    <div id="route-progress" class="route-progress" hidden>
      <div class="route-progress-info">
        <div id="route-names" class="muted"></div>
        <div id="route-count" class="route-count">0/0</div>
      </div>
      <div class="route-actions">
        <button id="route-change" class="btn" type="button">Đổi tuyến</button>
        <button id="route-reset" class="btn" type="button">Làm lại</button>
      </div>
    </div>

    <form id="scan-form" class="scan-form" autocomplete="off">
      <label for="scan-input" class="sr-only">Mã vận đơn</label>
      <input id="scan-input" class="scan-input" type="text" enterkeyhint="go"
             placeholder="Quét hoặc nhập mã vận đơn…" autocapitalize="characters" spellcheck="false" />
      <button id="camera-btn" class="btn btn-icon" type="button" aria-label="Quét bằng camera">📷</button>
    </form>

    <!-- Fallback when live camera is blocked: take a photo with the native camera and decode it. -->
    <label id="photo-label" class="btn btn-photo" hidden>
      📸 Chụp ảnh mã vận đơn
      <input id="photo-input" type="file" accept="image/*" capture="environment" hidden />
    </label>

    <div id="camera-box" class="camera-box" hidden>
      <div id="camera-view"></div>
      <button id="camera-close" class="btn" type="button">Đóng camera</button>
    </div>
    <div id="file-decoder" hidden></div>

    <section id="result" class="result result-idle" aria-live="polite">
      <div id="result-location" class="result-location">Sẵn sàng quét</div>
      <div id="result-district" class="result-district"></div>
      <div id="result-code" class="result-code"></div>
    </section>

    <!-- Tuyến mode: wards of the selected routes and the scanned orders on a Goong map (order-map.js). -->
    <section id="map-box" class="map-box" hidden>
      <div id="map-note" class="muted"></div>
      <div id="order-map" class="order-map"></div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="lookup.js"></script>
  <script src="order-map.js"></script>
  <script src="app.js"></script>
</body>
</html>
